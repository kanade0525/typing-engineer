# npm run check を PR ごとに走らせる。
# 手元でしか回らない検査は、いずれ回されなくなる。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 依存パッケージは無いので install は要らない
      - run: npm run check
